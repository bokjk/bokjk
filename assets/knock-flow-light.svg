<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title">
<title id="title">끝난 지 4분 뒤에 알약에 올라오고, 15분이 지나면 Windows 알림으로 다시 알립니다. 설명용 그림입니다.</title>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d9deeb" stroke-opacity=".3"/></pattern>
<radialGradient id="bloom"><stop stop-color="#7050a2" stop-opacity=".12"/><stop offset="1" stop-color="#7050a2" stop-opacity="0"/></radialGradient>
<style>text{font-family:'Segoe UI','Malgun Gothic',sans-serif}
 .pulse{animation:pulse 3.6s ease-in-out infinite}
 .delay{animation-delay:1.2s}.later{animation-delay:2.4s}
 .wire{animation:wire 4s linear infinite}
 .spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}
 .caret{animation:caret 1.4s steps(2,end) infinite}
 .line-a{animation:code 6s ease-in-out infinite}.line-b{animation:code 6s 1s ease-in-out infinite}.line-c{animation:code 6s 2s ease-in-out infinite}
 @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
 @keyframes wire{to{stroke-dashoffset:-80}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes caret{50%{opacity:.15}}
 @keyframes code{0%,100%{opacity:.35}30%,65%{opacity:1}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.particle,.glint{display:none}}
.knock{transform-box:fill-box;transform-origin:center;opacity:0;animation:knock 4.8s ease-out infinite}.k2{animation-delay:.42s}.beat{transform-box:fill-box;transform-origin:center;animation:beat 4.8s ease-in-out infinite}.r1,.r2,.r3{animation:rowin 9.6s ease-out infinite}.r2{animation-delay:.3s}.r3{animation-delay:.6s}.wire{animation:wire 4s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.delay{animation-delay:1.2s}.later{animation-delay:2.4s}@keyframes knock{0%{opacity:.7;transform:scale(1)}22%{opacity:0;transform:scale(3.1)}100%{opacity:0;transform:scale(3.1)}}@keyframes beat{0%,9%,100%{transform:scale(1)}4%{transform:scale(1.35)}13%{transform:scale(1.35)}18%{transform:scale(1)}}@keyframes rowin{0%{opacity:0;transform:translateY(5px)}7%,93%{opacity:1;transform:none}100%{opacity:0;transform:none}}@keyframes wire{to{stroke-dashoffset:-80}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.knock{display:none}}</style></defs>
<rect width="960" height="350" rx="20" fill="#f5f4fc"/>
<rect width="960" height="350" rx="20" fill="url(#grid)"/>
<ellipse cx="768" cy="70" rx="480" ry="350" fill="url(#bloom)"/>
<defs><filter id="lift" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#3c301e" flood-opacity="0.22"/></filter></defs><text x="32" y="50" font-size="32" fill="#21263b" font-weight="700">바로 울리지 않습니다.</text><text x="928" y="48" font-size="20" fill="#59657a" text-anchor="end">승인은 1분 · 질문과 완료는 4분 뒤</text><path d="M150 134H780" stroke="#d9deeb" stroke-width="2"/><path class="wire" d="M150 134H780" stroke="#9b3f4b" stroke-opacity=".7" stroke-width="2" stroke-dasharray="8 32"/><rect x="135" y="119" width="30" height="30" rx="10" fill="#ffffff" stroke="#d9deeb"/><circle class="pulse " cx="150" cy="134" r="5.5" fill="#9b3f4b"/><text x="150" y="106" font-size="22" fill="#9b3f4b" text-anchor="middle" font-weight="700">0분</text><g transform="translate(150 190) scale(1.25) translate(-150 0)"><g filter="url(#lift)"><rect x="134" y="16" width="32" height="32" rx="16" fill="#fffdf8" stroke="#493e30" stroke-opacity="0.16"/></g><circle cx="150" cy="32" r="6.4" fill="none" stroke="#292722" stroke-width="1.6" opacity=".8"/><circle class="" cx="150" cy="32" r="2.9" fill="#b5761f"/></g><text x="150" y="286" font-size="22" fill="#21263b" text-anchor="middle">AI가 끝내거나 물어봄</text><rect x="455" y="119" width="30" height="30" rx="10" fill="#ffffff" stroke="#d9deeb"/><circle class="pulse delay" cx="470" cy="134" r="5.5" fill="#9b3f4b"/><text x="470" y="106" font-size="22" fill="#9b3f4b" text-anchor="middle" font-weight="700">4분</text><g transform="translate(470 190) scale(1.25) translate(-470 0)"><g filter="url(#lift)"><rect x="396.5" y="16" width="147" height="32" rx="16" fill="#fffdf8" stroke="#493e30" stroke-opacity="0.16"/></g><circle cx="412.5" cy="32" r="6.4" fill="none" stroke="#292722" stroke-width="1.6" opacity=".8"/><circle class="" cx="412.5" cy="32" r="2.9" fill="#b5761f"/><text x="429.5" y="36.5" font-size="13" fill="#292722" font-weight="700">1건</text><text x="456.78" y="36.5" font-size="12" fill="#716b61" >가장 오래 4분</text></g><text x="470" y="286" font-size="22" fill="#21263b" text-anchor="middle">알약에 올라옵니다</text><rect x="765" y="119" width="30" height="30" rx="10" fill="#ffffff" stroke="#d9deeb"/><circle class="pulse later" cx="780" cy="134" r="5.5" fill="#9b3f4b"/><text x="780" y="106" font-size="22" fill="#9b3f4b" text-anchor="middle" font-weight="700">15분</text><g transform="translate(780 170) scale(1.25) translate(-780 0)"><g filter="url(#lift)"><rect x="665" y="0" width="230" height="64" rx="10" fill="#fffdf8" stroke="#493e30" stroke-opacity="0.16"/></g><circle cx="687" cy="22" r="6.4" fill="none" stroke="#292722" stroke-width="1.6" opacity=".8"/><circle class="" cx="687" cy="22" r="2.9" fill="#b5761f"/><text x="705" y="26.5" font-size="13" fill="#292722" font-weight="700">결제 오류 수정</text><text x="705" y="46" font-size="12" fill="#716b61" >15분째 기다리는 중 · 대화 열기</text></g><text x="780" y="286" font-size="22" fill="#21263b" text-anchor="middle">Windows 알림으로 다시</text><text x="480" y="326" font-size="19" fill="#59657a" text-anchor="middle">그 사이에 처리하면 조용히 내려갑니다 · 설명용 그림</text>
</svg>
