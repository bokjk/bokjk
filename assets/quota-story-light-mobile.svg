      <g clip-path="url(#bar-0-1)"><rect class="glint" x="87" y="121" width="48" height="18" fill="#fff" opacity=".32" style="animation-delay:0.35s"/></g><text x="516" y="139" font-size="27" fill="#21263b" text-anchor="end">28% 남음</text></g><g transform="translate(32 280)"><rect width="536" height="180" rx="16" fill="#ffffff" stroke="#d9deeb"/><text x="22" y="40" font-size="28" fill="#21263b" font-weight="700">Claude</text><circle class="pulse delay" cx="508" cy="30" r="5" fill="#865b23"/><text x="22" y="85" font-size="28" fill="#59657a" >5시간</text><rect x="135" y="67" width="236" height="18" rx="9" fill="#e6e8f1"/>
      <rect x="135" y="67" width="174.64" height="18" rx="9" fill="#865b23"/>
      <clipPath id="bar-1-0"><rect x="135" y="67" width="174.64" height="18" rx="9"/></clipPath>
