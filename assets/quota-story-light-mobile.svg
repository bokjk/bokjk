      <g clip-path="url(#bar-0-0)"><rect class="glint" x="87" y="67" width="48" height="18" fill="#fff" opacity=".32" style="animation-delay:0s"/></g><text x="516" y="85" font-size="27" fill="#21263b" text-anchor="end">62% 남음</text><text x="22" y="139" font-size="28" fill="#59657a" >주간</text><rect x="135" y="121" width="236" height="18" rx="9" fill="#e6e8f1"/>
