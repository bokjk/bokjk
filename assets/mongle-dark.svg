<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 164" role="img" aria-labelledby="title">
<title id="title">01 · Mongle — 작업 중엔 타닥타닥. 끝나면 폴짝.</title>
<defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#f2bc76" stroke-opacity=".065"/></pattern>
<linearGradient id="trail"><stop stop-color="#f2bc76" stop-opacity="0"/><stop offset="1" stop-color="#f2bc76"/></linearGradient>
<clipPath id="rail"><rect x="32" y="134" width="896" height="6" rx="3"/></clipPath>
<style>.trail{animation:travel 7s ease-in-out infinite}.dot{animation:breathe 3s ease-in-out infinite}@keyframes travel{0%{transform:translateX(-140px)}100%{transform:translateX(960px)}}@keyframes breathe{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.trail{display:none}}</style></defs>
<rect width="960" height="164" rx="18" fill="#0d1424"/>
<rect width="960" height="164" rx="18" fill="url(#grid)"/>
<path d="M30 1H930" stroke="#f2bc76" stroke-opacity=".55"/>
<text x="32" y="49" fill="#f2bc76" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="20" letter-spacing="2">01 / Mongle</text>
<circle class="dot" cx="920" cy="42" r="5" fill="#f2bc76"/>
<text x="32" y="109" fill="#f0f2fc" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="34" font-weight="700">작업 중엔 타닥타닥. 끝나면 폴짝.</text>
<path d="M32 137H928" stroke="#f2bc76" stroke-opacity=".18"/>
<path d="M32 137H108" stroke="#f2bc76" stroke-width="3"/>
<g clip-path="url(#rail)"><rect class="trail" x="32" y="135" width="140" height="4" fill="url(#trail)"/></g>
</svg>