<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 778" role="img" aria-labelledby="title">
<title id="title">작업 PC에서 실행 중인 터미널을 Tailscale로 연결한 휴대폰에서 확인하고 입력하는 개념도</title>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#34435e" stroke-opacity=".3"/></pattern>
<radialGradient id="bloom"><stop stop-color="#c4a4ff" stop-opacity=".12"/><stop offset="1" stop-color="#c4a4ff" stop-opacity="0"/></radialGradient>
<style>text{font-family:'Segoe UI','Malgun Gothic',sans-serif}
 .pulse{animation:pulse 3.6s ease-in-out infinite}
 .delay{animation-delay:1.2s}.later{animation-delay:2.4s}
 .wire{animation:wire 4s linear infinite}
 .spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}
 .caret{animation:caret 1.4s steps(2,end) infinite}
 .line-a{animation:code 6s ease-in-out infinite}.line-b{animation:code 6s 1s ease-in-out infinite}.line-c{animation:code 6s 2s ease-in-out infinite}
 @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
 @keyframes wire{to{stroke-dashoffset:-80}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes caret{50%{opacity:.15}}
 @keyframes code{0%,100%{opacity:.35}30%,65%{opacity:1}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.particle,.glint{display:none}}
</style></defs>
<rect width="600" height="778" rx="20" fill="#101728"/>
<rect width="600" height="778" rx="20" fill="url(#grid)"/>
<ellipse cx="480" cy="155.60000000000002" rx="300" ry="778" fill="url(#bloom)"/>
<text x="32" y="50" font-size="34" fill="#f2f1fa" font-weight="700">작업은 PC에서.</text><text x="32" y="96" font-size="34" fill="#f2f1fa" font-weight="700">확인은 내 손에서.</text><g transform="translate(32 132)"><rect width="536" height="224" rx="16" fill="#19243a" stroke="#34435e" stroke-width="2"/>
  <path d="M0 44h536" stroke="#34435e"/>
  <circle cx="22" cy="22" r="4" fill="#f2bc76"/><circle cx="38" cy="22" r="4" fill="#c4a4ff"/><circle cx="54" cy="22" r="4" fill="#7ddcc8"/><text x="76" y="30" font-size="24" fill="#f2f1fa" >작업 PC</text><text x="516" y="30" font-size="22" fill="#7ddcc8" text-anchor="end">실행 중</text><path d="M268 44v180" stroke="#34435e"/><text x="18" y="82" font-size="29" fill="#f2f1fa" font-weight="700">Claude</text><text x="18" y="116" font-size="27" fill="#7ddcc8" >작업 중</text><circle class="spin" cx="148" cy="106" r="11" fill="none" stroke="#7ddcc8" stroke-width="3" stroke-dasharray="40 30"/><rect class="line-a" x="18" y="143" width="158" height="7" rx="3.5" fill="#afb9ce" opacity=".55"/><rect class="line-b" x="18" y="163" width="202" height="7" rx="3.5" fill="#c4a4ff" opacity=".55"/><rect class="line-c" x="18" y="183" width="126" height="7" rx="3.5" fill="#afb9ce" opacity=".55"/><text x="286" y="82" font-size="29" fill="#f2f1fa" font-weight="700">Codex</text><text x="286" y="116" font-size="27" fill="#f2bc76" >확인 요청</text><circle class="pulse" cx="446" cy="106" r="12" fill="#f2bc76" fill-opacity=".15"/><text x="446" y="114" font-size="22" fill="#f2bc76" text-anchor="middle" font-weight="700">?</text><rect class="line-a" x="286" y="143" width="158" height="7" rx="3.5" fill="#afb9ce" opacity=".55"/><rect class="line-b" x="286" y="163" width="202" height="7" rx="3.5" fill="#c4a4ff" opacity=".55"/><rect class="line-c" x="286" y="183" width="126" height="7" rx="3.5" fill="#afb9ce" opacity=".55"/></g><path d="M300 366v36" fill="none" stroke="#34435e" stroke-width="3"/><path class="wire" d="M300 366v36" fill="none" stroke="#7ddcc8" stroke-width="3" stroke-dasharray="8 12"/><text x="326" y="392" font-size="25" fill="#afb9ce" >Tailscale</text><g transform="translate(205 414)"><rect width="190" height="260" rx="26" fill="#19243a" stroke="#afb9ce" stroke-width="2"/>
  <rect x="63" y="12" width="64" height="5" rx="2.5" fill="#34435e"/><text x="20" y="57" font-size="26" fill="#f2f1fa" font-weight="700">같은 터미널</text><text x="20" y="92" font-size="24" fill="#afb9ce" >출력 확인</text><rect class="line-a" x="20" y="112" width="116" height="6" rx="3" fill="#afb9ce" opacity=".55"/><rect class="line-b" x="20" y="131" width="148" height="6" rx="3" fill="#c4a4ff" opacity=".55"/><rect class="line-c" x="20" y="150" width="94" height="6" rx="3" fill="#afb9ce" opacity=".55"/><rect x="16" y="177" width="158" height="52" rx="10" fill="#101728" stroke="#34435e"/><text x="27" y="211" font-size="25" fill="#7ddcc8" >입력</text><rect class="caret" x="91" y="212" width="16" height="3" fill="#7ddcc8"/></g><text x="300" y="718" font-size="28" fill="#f2f1fa" text-anchor="middle">Tailscale 연결 · 작업 PC는 켜 둔 채로</text><text x="300" y="753" font-size="24" fill="#afb9ce" text-anchor="middle">연결 흐름을 그린 개념 애니메이션</text>
</svg>
